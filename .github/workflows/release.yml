name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY: animepahe-dl

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl pkg-config tar git \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Verify tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          tag="${INPUT_TAG:-${GITHUB_REF_NAME:-}}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF#refs/tags/}"; fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Expected a v-prefixed semver tag, got '$tag'" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$manifest_version" || {
            echo "Tag version $version does not match Cargo.toml version $manifest_version" >&2
            exit 1
          }
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null || git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check out release tag
        run: git checkout --detach "refs/tags/${TAG}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux x64 release
        run: |
          set -eu
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          binary="target/x86_64-unknown-linux-gnu/release/${BINARY}"
          test "$("$binary" --version)" = "$VERSION"
          mkdir -p dist
          cp "$binary" "dist/${BINARY}"
          cp README.md dist/README.md
          archive="${BINARY}_${VERSION}_linux_amd64.tar.gz"
          tar -C dist -czf "dist/$archive" "$BINARY" README.md
          (cd dist && sha256sum "$archive" > checksums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" \
              --notes "Automated release of ${TAG}.\n\nSee checksums.txt for SHA-256 sums." \
              "${prerelease[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
          sha="$(git rev-parse HEAD)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -F "sha=${sha}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/latest -f "sha=${sha}" >/dev/null
          fi
          echo "Updated latest tag to ${TAG} (${sha})"
