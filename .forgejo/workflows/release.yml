name: Release

# Builds the animepahe-dl Rust CLI for Linux x64 and publishes the archive and
# checksums to a Forgejo release.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Or run this workflow manually with an existing tag name.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY: animepahe-dl

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -eu
          packages="build-essential ca-certificates curl jq pkg-config tar git libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev"
          missing=""
          for package in $packages; do
            status="$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)"
            if [ "$status" != "installed" ]; then
              missing="$missing $package"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Installing missing packages:$missing"
            apt-get update
            apt-get install -y --no-install-recommends $missing
          else
            echo "All native build and packaging dependencies are already installed."
          fi

      - name: Verify tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME:-}"; fi
          if [ -z "$tag" ]; then tag="${GITHUB_REF#refs/tags/}"; fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Expected a v-prefixed semver tag, got '$tag'" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "Releasing $tag (version $version)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check out release tag
        run: |
          set -eu
          git check-ref-format "refs/tags/${TAG}"
          git rev-parse --verify "refs/tags/${TAG}^{commit}"
          git checkout --detach "refs/tags/${TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"

      - name: Verify release manifest
        run: |
          set -eu
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$VERSION" = "$manifest_version" || {
            echo "Tag version $VERSION does not match Cargo.toml version $manifest_version" >&2
            exit 1
          }

      - name: Check cached Rust toolchain
        id: rust
        run: |
          set -eu
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export PATH="$CARGO_HOME/bin:$PATH"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"

          # Fail clearly rather than downloading Rust into a disposable /opt
          # directory when a runner cache mount has been silently dropped.
          for directory in "$CARGO_HOME" "$RUSTUP_HOME"; do
            case "$directory" in
              /opt/cargo|/opt/rustup)
                if ! awk -v directory="$directory" '$5==directory {found=1} END {exit !found}' /proc/self/mountinfo; then
                  echo "::error::Persistent cache is not mounted at $directory; check runner container.valid_volumes"
                  exit 1
                fi
                ;;
            esac
          done

          ready=false
          if command -v cargo >/dev/null 2>&1 && command -v rustc >/dev/null 2>&1 &&
              RUSTUP_AUTO_INSTALL=0 cargo --version >/dev/null 2>&1 &&
              RUSTUP_AUTO_INSTALL=0 rustc --version >/dev/null 2>&1; then
            target_libdir="$(RUSTUP_AUTO_INSTALL=0 rustc --print target-libdir --target x86_64-unknown-linux-gnu 2>/dev/null || true)"
            if [ -d "$target_libdir" ]; then
              ready=true
              echo "Reusing cached Rust: $(RUSTUP_AUTO_INSTALL=0 rustc --version)"
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo "Cached Rust or the Linux x64 target is missing; installing once into $RUSTUP_HOME."
          fi

      - name: Setup Rust
        if: steps.rust.outputs.ready != 'true'
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Build Linux x64 release
        run: |
          set -eu
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          binary="target/x86_64-unknown-linux-gnu/release/${BINARY}"
          test "$("$binary" --version)" = "$VERSION"
          mkdir -p dist
          cp "$binary" "dist/${BINARY}"
          cp README.md dist/README.md
          archive="${BINARY}_${VERSION}_linux_amd64.tar.gz"
          tar -C dist -czf "dist/$archive" "$BINARY" README.md
          (cd dist && sha256sum "$archive" > checksums.txt)

      - name: Publish release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "${TOKEN:-}" ]; then
            echo "No release token available." >&2
            exit 1
          fi
          api="${SERVER}/api/v1/repos/${REPO}"
          auth="Authorization: token ${TOKEN}"
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          id="$(curl -fsS -H "$auth" "${api}/releases/tags/${TAG}" 2>/dev/null | jq -r '.id // empty' || true)"
          if [ -z "$id" ]; then
            body="$(printf 'Automated release of %s.\n\nSee checksums.txt for SHA-256 sums.\n' "$TAG")"
            payload="$(jq -n --arg tag "$TAG" --arg name "$TAG" --arg body "$body" --argjson pre "$prerelease" \
              '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:$pre}')"
            id="$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data "$payload" "${api}/releases" | jq -r '.id')"
            echo "Created release ${TAG} (id ${id})"
          else
            echo "Reusing existing release ${TAG} (id ${id})"
          fi
          curl -fsS -H "$auth" "${api}/releases/${id}/assets?limit=100" \
            | jq -r '.[].id' \
            | while read -r asset_id; do
                [ -n "$asset_id" ] && curl -fsS -X DELETE -H "$auth" "${api}/releases/assets/${asset_id}" || true
              done
          for file in dist/*; do
            echo "Uploading $(basename "$file")"
            curl -fsS -X POST -H "$auth" -F "attachment=@${file}" \
              "${api}/releases/${id}/assets?name=$(basename "$file")" >/dev/null
          done
          sha="$(git rev-parse HEAD)"
          if curl -fsS -H "$auth" "${api}/git/refs/tags/latest" >/dev/null 2>&1; then
            payload="$(jq -n --arg sha "$sha" '{sha:$sha,force:true}')"
            curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' \
              --data "$payload" "${api}/git/refs/tags/latest" >/dev/null
          else
            payload="$(jq -n --arg sha "$sha" '{ref:"refs/tags/latest",sha:$sha}')"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data "$payload" "${api}/git/refs" >/dev/null
          fi
          echo "Updated latest tag to ${TAG} (${sha})"
          echo "Published ${TAG}: ${SERVER}/${REPO}/releases/tag/${TAG}"
